    <title>talea-storytelling</title>

    <!-- I titoli di capitolo sono in Newsreader e il corpo in Inter. Il foglio
         di stile dei font sta QUI e non più in un @import dentro theme.css:
         dentro il CSS la richiesta a Google partiva solo dopo che il bundle CSS

    <!-- Il poster è il primo fotogramma garantito della storia: se il video non
         fa in tempo, è quello che il lettore vede. Vale la precedenza. -->
    <link rel="preload" as="image" href="/what/data/hero/bologna-poster.jpg" />

    <!-- ── Schermata d'ingresso ────────────────────────────────────────────────
         Sta qui, inline, e non in un componente React di proposito: un loader
         montato da React può apparire solo DOPO che il bundle è stato scaricato
         e interpretato, cioè coprirebbe la seconda metà dell'attesa lasciando
         scoperta la prima — che è esattamente quella bianca e vuota. Inline
         dipinge al primo frame utile, prima di qualsiasi CSS e di qualsiasi JS. -->
    <style>
      .talea-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2rem;
        /* --paper del tema, ripetuto a mano: theme.css qui non è ancora arrivato. */
        background: #f6f4ee;
        opacity: 1;
        transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .talea-boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .tb-locked,
      .tb-locked body {
        overflow: hidden;
      }

      .talea-resize-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        background: #f6f4ee;
      }
      .talea-resize-frame {
        position: absolute;
        width: 1700px;
        height: 100vh;
        border: 0;
        transform-origin: top left;
        background: #f6f4ee;
      }

      .tb-logo {
        width: min(46vw, 230px);
        height: auto;
        overflow: visible;
      }

      .tb-blue,
      .tb-yellow,
      .tb-branch,
      .tb-vein {
        fill: none;
        /* pathLength="1" su ogni tratto: la lunghezza reale non conta più, il
           disegno si anima con un solo valore per tutti. */
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .tb-blue {
        stroke: #3673c0;
        stroke-width: 15.524;
        stroke-linecap: round;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .tb-yellow {
        stroke: #f7e91a;
        stroke-width: 15.524;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .tb-branch {
        stroke: #38b850;
        stroke-width: 15.524;
        stroke-linecap: round;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .tb-vein {
        stroke: #38b850;
        stroke-width: 7.772;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tb-word {
        fill: #17361c;
      }
      /* L'animazione sta sul GRUPPO, non sul path: una `transform` messa via CSS
         sostituisce in blocco l'attributo `transform` dell'elemento, e la
         scritta perderebbe il proprio translate finendo fuori dai cerchi.
         Sul gruppo invece si compone, perché il gruppo non ne ha uno suo. */
      .tb-word-g {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }
      .tb-yellow-fill {
        fill: #f7e91a;
        opacity: 0;
      }

      @keyframes tb-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes tb-appear {
        from {
          opacity: 0;
          /* Solo scala: una traslazione qui erediterebbe il flip verticale
             della matrice di root e salirebbe dalla parte sbagliata. */
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes tb-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes tb-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.028);
          opacity: 0.88;
        }
      }

      /* ── La talea germoglia ──
         Prima il ramo, poi le venature che spuntano, poi i due cerchi che si
         chiudono attorno e la scritta che emerge. È il nome del progetto: una
         talea è un ramo tagliato che mette radici. */
      .tb-branch {
        animation: tb-draw 460ms 40ms cubic-bezier(0.33, 0, 0.2, 1) forwards;
      }
      .tb-vein {
        animation: tb-draw 240ms cubic-bezier(0.33, 0, 0.2, 1) forwards;
      }
      .tb-p3 { animation-delay: 380ms; }
      .tb-p4 { animation-delay: 418ms; }
      .tb-p5 { animation-delay: 456ms; }
      .tb-p6 { animation-delay: 494ms; }
      .tb-p7 { animation-delay: 532ms; }
      .tb-p12 { animation-delay: 570ms; }
      .tb-p13 { animation-delay: 608ms; }
      .tb-word-g {
        animation: tb-appear 380ms 560ms cubic-bezier(0.2, 0, 0.2, 1) forwards;
      }
      .tb-blue {
        animation: tb-draw 700ms 620ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .tb-yellow {
        animation: tb-draw 700ms 700ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .tb-yellow-fill {
        animation: tb-fade 260ms 1180ms linear forwards;
      }
      /* Finito il disegno il logo non si ferma di colpo: respira, così un'attesa
         lunga non sembra mai un blocco. */
      .tb-logo {
        animation: tb-breathe 3.2s 1500ms ease-in-out infinite;
      }

      /* ── Barra di avanzamento ──
         Compare SOLO se l'attesa supera la soglia oltre la quale il lettore
         inizia a chiedersi se si è rotto qualcosa. Sotto quella soglia il
         respiro del logo basta, e una barra sarebbe rumore. */
      .tb-bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: rgba(27, 58, 41, 0.12);
        overflow: hidden;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .talea-boot.is-slow .tb-bar {
        opacity: 1;
      }
      .tb-bar-fill {
        display: block;
        width: 100%;
        height: 100%;
        background: #38b850;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .tb-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ── Cancello schermi piccoli ────────────────────────────────────────
         La storia è scroll-driven: mappe che si montano l'una sull'altra,
         grafici che si scoprono per gradi, un video a tutta pagina. Dentro un
         viewport piccolo non è "stretta", è rotta — e una pagina rotta
         costa più di una porta chiusa con scritto sopra il perché.
         Sta qui, inline, per la stessa ragione della schermata d'ingresso: si
         dipinge al primo fotogramma utile, prima di qualunque bundle. Da
         togliere quando la versione per schermi piccoli sarà pronta. */
      .talea-gate {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2.5rem 1.75rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
        /* --paper e --ink del tema, ripetuti a mano: qui theme.css non arriva
           mai, perché su schermi piccoli l'app non si monta affatto. */
        background: #f6f4ee;
        color: #1b3a29;
        text-align: center;
        /* Telefono basso e girato di lato: il testo scorre invece di uscire. */
        overflow-y: auto;
      }
      .talea-gate[hidden] {
        display: none;
      }
      /* Il marchio non è duplicato: è lo stesso nodo della schermata
         d'ingresso, spostato qui dallo script. Una sola copia del disegno, e
         l'animazione di germoglio se la porta dietro. */
      .talea-gate .tb-logo {
        width: min(58vw, 186px);
      }

      .tg-text {
        max-width: 31ch;
      }
      .tg-title {
        margin: 0;
        font-family: "Newsreader", Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.45rem, 6.2vw, 1.9rem);
        line-height: 1.22;
        letter-spacing: -0.01em;
        color: #0b2a18;
      }
      .tg-body {
        margin: 0.85rem 0 0;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.55;
        color: #55705f;
      }

      /* Telefono girato di lato: quattrocento pixel d'altezza non reggono il
         respiro verticale del ritratto. Qui si stringe invece di scorrere. */
      @media (max-height: 520px) {
        .talea-gate {
          gap: 1.1rem;
          padding: 1.5rem 1.75rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
        }
        .talea-gate .tb-logo {
          width: min(24vw, 104px);
        }
        .tg-text {
          max-width: 46ch;
        }
        .tg-title {
          font-size: clamp(1.15rem, 3.1vw, 1.5rem);
        }
        .tg-body {
          margin-top: 0.5rem;
          font-size: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tb-logo,
        .tb-logo path,
        .tb-word-g {
          animation: none !important;
        }
        .tb-blue,
        .tb-yellow,
        .tb-branch,
        .tb-vein {
          stroke-dashoffset: 0;
        }
        /* Niente `transform: none` sui path, per la stessa ragione di sopra. */
        .tb-word-g,
        .tb-yellow-fill {
          opacity: 1;
        }
        .talea-boot {
          animation: tb-fade 300ms linear;
        }
      }
    </style>

    <!-- Il marchio qui dentro non c'è: se il cancello si apre, ci arriva
         quello della schermata d'ingresso, spostato dallo script qui sotto. -->
    <div id="talea-gate" class="talea-gate" role="dialog" aria-labelledby="tg-title" hidden>
      <div class="tg-text">
        <h1 class="tg-title" id="tg-title">TALEA, per ora, si guarda da uno schermo grande.</h1>
        <p class="tg-body">
          Stiamo costruendo la versione per schermi piccoli. Nel frattempo la
          storia è pronta e ti aspetta su computer o schermi più grandi.

    <script>
      // ── Il cancello degli schermi piccoli ────────────────────────────────
      // Gira PRIMA dello script della schermata d'ingresso, di proposito: se
      // il cancello si chiude, il boot non deve nemmeno partire — aspetterebbe
      // il montaggio di un'app che non si monterà.
      (function () {
        var gate = document.getElementById("talea-gate");
        if (!gate) return;
        if (window.__taleaViewportFrameShell) return;
        var config = window.__taleaViewportConfig || {
          blockMaxWidth: 1023,
          blockMaxHeight: 799,
        };
        var width = window.innerWidth || document.documentElement.clientWidth;
        var height = window.innerHeight || document.documentElement.clientHeight;
        var coarsePointer = window.matchMedia("(pointer: coarse)").matches;

        // Telefoni e tablet piccoli restano fuori. Serve il dito (pointer:
        // coarse) E una larghezza sotto soglia; l'altezza resta una rete per i
        // dispositivi bassi/girati, ma più stretta perché il problema vero è la
        // colonna troppo corta in orizzontale. La soglia include anche iPad
        // mini e iPad Air, che hanno ancora poco spazio per questa storia.
        var smallTouchScreen =
          coarsePointer && (width <= config.blockMaxWidth || height <= config.blockMaxHeight);
        if (!smallTouchScreen) return;

        // Bandiera letta da main.jsx: l'app non si monta proprio. Montarla
        // dietro a un pannello opaco vorrebbe dire scaricare il video
        // dell'hero, accendere le mappe e mettere in ascolto gli osservatori
        // di scroll per una pagina che nessuno vedrà — sulla rete di un
        // dispositivo piccolo, per giunta.
        window.__taleaMobileGate = true;

        gate.hidden = false;
        document.documentElement.classList.add("tb-locked");

        var boot = document.getElementById("talea-boot");
        if (boot) {
          var mark = boot.querySelector(".tb-logo");
          if (mark) gate.insertBefore(mark, gate.firstChild);
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }

      })();
    </script>

    <div id="root"></div>

    <script>
      // ── Il cancello d'ingresso ──────────────────────────────────────────────
      // Regola d'ingaggio: si aspettano i font, il montaggio dell'app e il primo
      // fotogramma dell'hero (video pronto, oppure poster, oppure errore). NON si
      // aspetta il download completo del video: nessuno resta fermo davanti a uno
      // spinner per venti secondi, e comunque il poster copre il caso peggiore.
      //
      // Sopra a tutto c'è un tetto duro: scaduto quello si entra comunque, anche
      // se il bundle è esploso. Un loader senza via d'uscita è peggio del vuoto
      // che dovrebbe coprire.
      (function () {
        var el = document.getElementById("talea-boot");
        if (!el) return;

        var MIN_MS = 900; // sotto questa soglia il loader lampeggerebbe e basta
        var MAX_MS = 3000; // tetto duro
        var SLOW_MS = 1600; // oltre questa compare la barra
        var FADE_MS = 520; // deve combaciare con la transition del CSS

        var t0 = Date.now();
        // «poster» e «hero» sono due cose diverse e vanno tenute separate: il
        // poster è l'immagine di riserva scaricata davvero, l'hero è il video
        // che ce l'ha fatta (o che ha rinunciato). Se il video è lento si esce
        // dal tetto duro, ma con la certezza che sotto c'è già un'immagine.
        var gates = { fonts: false, app: false, poster: false, hero: false };
        var names = ["fonts", "app", "poster", "hero"];
        var leaving = false;
        var fill = el.querySelector(".tb-bar-fill");

        document.documentElement.classList.add("tb-locked");

        function paint() {
          var n = 0;
          for (var i = 0; i < names.length; i++) if (gates[names[i]]) n++;
          if (fill) fill.style.transform = "scaleX(" + n / names.length + ")";
          return n;
        }

        function leave() {
          if (leaving) return;
          leaving = true;
          if (fill) fill.style.transform = "scaleX(1)";
          window.setTimeout(function () {
            el.classList.add("is-leaving");
            document.documentElement.classList.remove("tb-locked");
            window.setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, FADE_MS);
          }, Math.max(0, MIN_MS - (Date.now() - t0)));
        }

        function ready(name) {
          if (leaving || !(name in gates) || gates[name]) return;
          gates[name] = true;
          if (paint() === names.length) leave();
        }

        function mountResizeFrame() {
          var config = window.__taleaViewportConfig || {
            resizeWidth: 1700,
          };
          var virtualWidth = config.resizeWidth;
          var shell = document.createElement("div");
          var frame = document.createElement("iframe");
          var url = new URL(window.location.href);

          url.searchParams.set("talea-frame", String(virtualWidth));
          shell.className = "talea-resize-shell";
          frame.className = "talea-resize-frame";
          frame.title = "TALEA storytelling";
          frame.src = url.href;

          function fitFrame() {
            var scale = window.innerWidth / virtualWidth;
            var virtualHeight = Math.ceil(window.innerHeight / scale);
            frame.style.width = virtualWidth + "px";
            frame.style.height = virtualHeight + "px";
            frame.style.transform = "scale(" + scale + ")";
            frame.style.left = "0";
            frame.style.top = "0";
          }

          frame.addEventListener("load", function () {
            fitFrame();
            leave();
          });
          window.addEventListener("resize", fitFrame, { passive: true });
          shell.appendChild(frame);
          document.body.appendChild(shell);
          fitFrame();
        }

        window.__taleaBoot = { ready: ready, skip: leave };

        if (window.__taleaViewportFrameShell) {
          mountResizeFrame();
          return;
        }

        window.setTimeout(leave, MAX_MS);
        window.setTimeout(function () {
          if (!leaving) el.classList.add("is-slow");
        }, SLOW_MS);

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            ready("fonts");
          });
        } else {
          ready("fonts");
        }

        // Il poster è un background-image in CSS, che non emette eventi: lo si
        // scarica qui in parallelo per sapere quando è davvero pronto. La
        // richiesta è la stessa del <link rel="preload">, quindi non ne costa
        // una seconda — arriva dalla cache.
        var poster = new Image();
        poster.onload = poster.onerror = function () {
          ready("poster");
        };
        poster.src = "/data/hero/bologna-poster.jpg";
      })();
    </script>
  </body>
</html>
