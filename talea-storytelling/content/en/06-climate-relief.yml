cityPlan:
  id: climate-relief-city-plan
  bridge:
    id: climate-relief-city-plan-bridge
    lead: "Where they do not exist, they can be created."
  scene:
    id: climate-relief-city-plan-scene
    ariaLabel: "Where relief is missing, it can be built: an illustrative neighbourhood scenario in which green spaces, shaded routes and porticoes become a network"
    figureAriaLabel: "An illustrative scenario, not a map of construction projects. The plan combines recognisable elements of Bologna in a typical neighbourhood: an avenue, courtyard blocks, porticoed streets, apartment buildings, a paved square partly used for parking and the asphalt courtyard of a school. Much of the square remains paved, but permeable planting beds, water and shade are introduced; other paved spaces become green areas. A new stop, rows of trees and porticoes join the same network, while a shaded route crosses the map from the park to the garden."
    svgDescription: "A part of Bologna seen from above: the ring road with its tree-lined central reservation, the city centre with squares, courtyard buildings, open-fronted blocks and two porticoed streets. Beyond it lies a lower-density outer area with apartment blocks, terraced houses, detached homes, workshops, a paved square used as a car park and the asphalt courtyard of a school. As the story unfolds, much of the square remains paved, but permeable planting beds, water and shade are introduced, while the courtyard becomes greener. A stop, groups of trees, pergolas and porticoes connect them in a continuous band of shade running across the map from the park to the garden."
    context:
      id: climate-relief-city-plan-context
      title: "Where relief is missing, it can be built"
      note: "An illustrative neighbourhood scenario, not a map of construction projects"
  beats:
    - id: quartiere
      lead: "Climate refuges are not always close to everyone."
      body:
        - id: neighborhood-body
          text: "In some areas, parks and gardens remain far from people’s everyday routes."
    - id: buco
      lead: "Distance makes a difference."
      body:
        - id: distance-body
          text: "They need to be easy to reach."
    - id: costruisce
      lead: "Where they are missing, they can be created."
      body:
        - id: nature-before
          text: "These "
        - id: nature-keyword
          text: "nature-based solutions"
          kw: true
        - id: nature-after
          text: " draw on natural processes and can help urban spaces cope better with heat."
    - id: nonuno
      lead: "One place alone is not enough."
      body:
        - id: distributed-network-body
          text: "More spaces spread across neighbourhoods create a widespread presence, close to everyday life."
    - id: corridoi
      lead: "The route matters as much as the destination."
      body:
        - id: corridor-before
          text: "Connecting several points in the city along the same route creates a "
        - id: corridor-keyword
          text: "climate corridor"
          kw: true
        - id: corridor-after
          text: "."
    - id: portici
      lead: "Part of the network already exists."
      body:
        - id: porticoes-before
          text: "Bologna’s "
        - id: porticoes-keyword
          text: "porticoes"
          kw: true
        - id: porticoes-middle
          text: " form continuous, sheltered routes. The municipal "
        - id: shadow-lines-link
          text: "Linee d'ombra"
          linkId: shadow-lines-project
        - id: porticoes-after
          text: " project explores how to enhance them and connect them to climate refuges."
    - id: rete
      lead: "When places connect, the city changes."
      body:
        - id: connected-network-body
          text: "New spaces, climate corridors and porticoes can work together to form a continuous, accessible system."
  annotations:
    - id: parking
      label: "car park"
    - id: new-relief
      label: "new climate refuge"
    - id: corridor
      label: "climate corridor"
    - id: arcades
      label: "porticoes"
  legend:
    id: climate-relief-city-plan-legend
    label: "To connect places of relief"
    items:
      - id: new-green-spaces
        label: "new green spaces"
      - id: climate-corridors
        label: "climate corridors"
      - id: porticoes
        label: "porticoes"
  vignetteDescriptions:
    - id: costruire
      text: "A broad paved square between two apartment buildings, facing a street, with four cars parked in marked spaces along one edge, a drainage channel, streetlights, bollards and bicycle racks. Barriers arrive and two large planting beds open in the paving: bare soil appears beneath the stone, followed by grass. Four trees are planted, a pergola with climbing plants is assembled, a rain garden is excavated with gravel and stones, and a flush fountain comes to life at pavement level. Much of the stone remains, together with three benches and the people using them; a bus stop with a shelter also appears on the pavement."
    - id: corridoio
      text: "A street running along a row of apartment buildings. The pavement remains shaded along its entire length through four different elements, one after another: a stretch of portico with its arches, a pergola whose beams cast striped shadows, a row of three trees and finally a hedge with a small tree. At first the shade falls in separate patches; by the end it forms a continuous band, allowing people to travel from one end to the other without ever stepping into the sun."
    - id: portico
      text: "A Bolognese portico seen at an angle: three bays with piers along the street edge, round arches framed by voussoirs and keystones, and vaults extending back to the building wall, where the shop windows and ground-floor entrances can be seen. Above are three floors of shuttered windows and a pitched roof with a chimney. A continuous band of shade runs beneath the passage, where an older woman with a walking stick and a wheelchair user are present: the portico is already a refuge, particularly for those who need it most."
