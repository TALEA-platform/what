schemaVersion: 1
locale: en

chapter:
  id: climate-relief

opening:
  id: climate-relief-opening
  title: "Green spaces are the solution."
  lead:
    id: climate-relief-lead
    before: "A "
    term:
      id: climate-refuge-term
      text: "climate refuge"
      glossary: climate-refuge
    after: " comes into being when several forms of relief come together in the same place."
  body:
    - id: climate-relief-opening-body
      text: "This combination turns a place people simply pass through into somewhere to stop, cool down and catch their breath during the hottest hours."
  close: "Let’s see how a street can become one, one element at a time."

explainer:
  id: climate-refuge-explainer
  figure:
    id: climate-refuge-figure
    ariaLabel: "A sun-baked street in Bologna — with the Two Towers and the hills in the background — gradually becomes a climate refuge: shade, lightweight structures, seating, water, greenery and permeable ground appear, with a bus stop just a short walk away. The sun remains but feels gentler, objects cast shadows and an indicator shows the shift from very hot conditions to thermal comfort. The overheated people begin to smile again."
    svgAriaLabel: "What is a climate refuge?"
  model:
    id: climate-refuge-model
    title: "A neighbourhood square before its climate transformation"
    description: "A paved, sun-baked square surrounded by two Bolognese buildings and crossed by several people. The model can be rotated through 360 degrees."
    temperature:
      id: climate-refuge-temperature
      states:
        - id: very-hot
          text: "Very hot"
        - id: hot
          text: "Hot"
        - id: improving
          text: "Improving"
        - id: greater-comfort
          text: "Greater comfort"
        - id: thermal-comfort
          text: "Thermal comfort"
      locations:
        - id: start
          text: "in the sun"
        - id: natural-shade
          text: "under the trees"
        - id: continuous-shade
          text: "under shelter"
        - id: rest
          text: "under shelter"
        - id: water
          text: "near the water"
        - id: living-ground
          text: "near the water"
        - id: accessibility
          text: "inside the refuge"
        - id: complete
          text: "inside the refuge"
    controls:
      id: climate-refuge-model-controls
      panGroup: "Move the view"
      panUp: "Move the view up"
      panLeft: "Move the view left"
      panRight: "Move the view right"
      panDown: "Move the view down"
      zoomOut: "Zoom out"
      zoomIn: "Zoom in"
      hint: "Drag to rotate the square · double-click to zoom in"
  steps:
    - id: start
      added: "The transformation begins"
      paragraphs:
        - "A bare square with no shelter."
    - id: natural-shade
      added: "Natural shade"
      piece: "shade"
      paragraphs:
        - "Tree canopies filter the sun and provide the first shelter."
    - id: continuous-shade
      added: "Continuous shade"
      piece: "continuous shelter"
      paragraphs:
        - "Pergolas and canopies provide protection even where trees cannot reach."
    - id: rest
      added: "A place to rest"
      piece: "places to rest"
      paragraphs:
        - "A seat in the shade turns passing through into taking a break."
    - id: water
      added: "Water"
      piece: "water"
      paragraphs:
        - "Having water available to drink and cool down helps lower body temperature."
    - id: living-ground
      added: "Living ground"
      piece: "greenery and living ground"
      paragraphs:
        - "Ground-level greenery mitigates heat and allows rainwater to soak naturally into the soil."
    - id: accessibility
      added: "Accessibility"
      piece: "accessibility"
      paragraphs:
        - "A refuge truly works when it is inclusive and easy for everyone to reach."
    - id: complete
      added: "The refuge is complete"
      paragraphs:
        - "The same square, once difficult to cross, now welcomes anyone who needs a break."
        - "The real difference does not come from any one element, but from the way they work together to create a cooler, more comfortable microclimate."
  recipeLabel: "A climate refuge is made of"
  sequence:
    id: climate-refuge-sequence
    playing: "Watch the square · the next element is on its way"
    done: "Scroll to continue"

