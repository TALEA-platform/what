schemaVersion: 1
locale: en

project:
  chapter:
    id: talea-project
  header:
    id: talea-project-header
    title: "Bologna is already working on it."
    lockup: "The project is called"
    logo:
      id: talea-project-logo
      alt: "TALEA"
      linkId: talea-platform
  meaning:
    id: talea-project-meaning
    lead:
      - id: talea-name
        text: "TALEA"
        glossary: talea-project
      - id: talea-purpose
        text: " transforms public spaces using nature-based solutions, making them more liveable and helping the city adapt to a changing climate."
    body: "The name comes from the botanical idea of a cutting: a branch cut from the parent plant that, under the right conditions, takes root and continues to grow."
  facts:
    id: talea-project-facts
    label: "The project at a glance"
    items:
      - id: chi
        label: "Who runs it"
        value: "Comune di Bologna"
        noteTemplate: "with Università di Bologna and {n} other partners"
      - id: quando
        label: "How long it runs"
        value: "Until 2028"
        note: "42 months, from December 2024 to May 2028"
      - id: fondi
        label: "Who funds it"
        value: "European Union"
        note: "co-funded through the European Urban Initiative"
  bridge:
    id: talea-project-zones-bridge
    text: "The work starts here."

zones:
  id: talea-zones
  ariaLabel: "Map of the TALEA project's pilot areas"
  legend:
    id: talea-zones-legend
    area: "Project areas"
  intro:
    id: talea-zones-intro
    title: "TALEA takes shape across the city."
    body:
      - id: zones-intro-before-fossolo
        text: "Two initial intervention areas, shaped by local analysis and citizen participation: "
      - id: zones-intro-fossolo
        text: "Fossolo"
        emphasis: true
      - id: zones-intro-between
        text: " and the area "
      - id: zones-intro-historic-centre
        text: "north of the historic centre"
        emphasis: true
      - id: zones-intro-end
        text: "."
  areas:
    - zoneId: 0
      name: "Fossolo"
      body:
        - id: fossolo-before-place
          text: "In the Savena district, the work focuses on "
        - id: fossolo-place
          text: "Bosco Tanari"
          emphasis: true
        - id: fossolo-after-place
          text: " and the nearby green spaces, enhancing them and strengthening connections between parks and gardens."
    - zoneId: 1
      name: "Centro storico-Nord"
      body:
        - id: historic-centre-before-boldrini
          text: "Between "
        - id: historic-centre-boldrini
          text: "via Boldrini"
          emphasis: true
        - id: historic-centre-between-streets
          text: " and "
        - id: historic-centre-rosselli
          text: "via Fratelli Rosselli"
          emphasis: true
        - id: historic-centre-after-streets
          text: ", the project focuses on vegetation, soil and public space in a dense area with no ground capable of absorbing rainwater."
  loadError: "The map is currently unavailable."

participation:
  id: talea-participation
  title: "The project also grows through the contribution of the people who live in the city."
  body: "Residents take part through neighbourhood walks, meetings and workshops: they explain how they experience these places, the difficulties they face and what could improve them."

