closing:
  id: talea-closing
  final:
    id: talea-closing-final
    standout: "A tree, a fountain, a square that can breathe: this is how a cooler city is built, one cutting at a time."
  sources:
    id: talea-public-tools
    title: "Everything you have seen comes from here"
    intro: "These are public, open tools: you can explore them yourself."
    openLabel: "Open the web app"
    apps:
      - id: portale
        name: "TALEA platform"
        tag: "The project"
        description: "The gateway to all the project's tools and open data."
        linkId: talea-platform
      - id: historysuhi
        name: "Heat, summer after summer"
        tag: "HistorySUHI"
        description: "Where Bologna gets hottest, and how this changed from 2013 to 2025."
        linkId: history-suhi
      - id: sci
        name: "How much shade is there on the streets"
        tag: "SCI"
        description: "How much shade streets and squares receive, hour by hour, on a summer day."
