schemaVersion: 1
locale: it

chapter:
  id: hotspot

intro:
  id: hotspot-intro
  ariaLabel: "Introduzione hotspot"
  lead: "Se l’aria avvolge l’intera città in modo uniforme, le sue superfici reagiscono al sole in modo differente da una zona all’altra."
  vignettes:
    - id: superficie
      figureLabel: "Una strada al tramonto. Un satellite misura dall’alto il calore delle superfici: il tetto segna 48 gradi, l’asfalto 52, la panchina 41, mentre il termometro della persona che cammina segna 34 gradi d’aria."
      visual:
        ariaLabel: "L’aria e le superfici, alla stessa ora"
        description: "Illustrazione a matita colorata: una strada d’estate. Un satellite misura dall’alto il calore delle superfici. Il tetto segna 48 gradi, l’asfalto 52, la panchina 41, mentre il termometro della persona che cammina segna 34 gradi d’aria."
        labels:
          air: "l’aria"
      paragraphs:
        - id: surface-temperature-explanation
          segments:
            - id: surface-satellites
              text: "I satelliti registrano la "
            - id: surface-temperature-term
              text: "temperatura di superficie"
              glossary: surface-temperature
            - id: surface-definition
              text: ": il calore accumulato da asfalto, tetti e piazze durante il giorno e rilasciato a lungo dopo il tramonto."
    - id: ricorrenza
      figureLabel: "Tre fogli sovrapposti mostrano la stessa porzione di città vista dall’alto, uno per estate. In ognuno alcune zone sono fra le più calde, ma solo due tornano su tutti i fogli."
      visual:
        ariaLabel: "La stessa città, estate dopo estate"
        description: "Illustrazione a matita colorata: tre carte sovrapposte mostrano il territorio del comune di Bologna visto dall’alto, una per estate, con sopra la griglia con cui la temperatura di superficie viene campionata. In ogni carta alcune caselle sono fra le più calde, ma solo due tornano su tutte e tre: sono cerchiate a matita."
        labels:
          recurring: "sempre tra le più calde"
      paragraphs:
        - id: recurring-pattern
          segments:
            - id: recurring-pattern-body
              text: " Misurato su più estati, questo valore fa emergere un disegno ricorrente: le stesse zone di Bologna finiscono quasi sempre tra le più calde ogni anno."
        - id: hotspot-definition
          segments:
            - id: hotspot-definition-intro
              text: "Sono gli "
            - id: hotspot-definition-term
              text: "hotspot climatici"
              glossary: climate-hotspot
            - id: hotspot-definition-body
              text: ": le superfici che rientrano nel 10% con le temperature più alte della città, estate dopo estate."
  closer:
    id: hotspot-intro-closer
    text: "Andiamo a cercarli sulla mappa."

map:
  id: hotspot-map
  ariaLabel: "Mappa hotspot"
  steps:
    - id: threshold
      paragraphs:
        - id: threshold-pattern
          segments:
            - id: threshold-pattern-body
              text: " Osservando le ultime 14 estati, il calore si concentra lungo specifici assi della città, risparmiando colli, parchi e campagna."
        - id: threshold-narrow
          segments:
            - id: threshold-narrow-body
              text: "Stringiamo il campo."
    - id: recurrence
      paragraphs:
        - id: recurrence-pattern
          segments:
            - id: recurrence-pattern-body
              text: " Emergono le zone dove i picchi termici sono più frequenti: la prova che questo comportamento sia ormai una caratteristica fissa."
    - id: persistence
      paragraphs:
        - id: persistence-definition
          segments:
            - id: persistence-definition-intro
              text: "Ecco gli "
            - id: persistence-definition-term
              text: "hotspot climatici"
              kw: true
            - id: persistence-definition-body
              text: " di Bologna: superfici che ogni anno accumulano e trattengono calore, faticando a raffreddarsi."
        - id: persistence-question
          segments:
            - id: persistence-question-body
              text: "Resta una domanda…"
  annotations:
    id: hotspot-annotations
    ariaLabel: "Annotazioni hotspot"
    items:
      - id: centro-storico
        name: "Centro storico"
        tag: "dentro le mura"
        context: "edifici ravvicinati e stretti dentro le mura"
      - id: stazione-centrale
        name: "Stazione Centrale"
        tag: "binari e piazzali"
        context: "la fascia dei binari trattiene il sole fino a notte"
      - id: scalo-ravone
        name: "Scalo Ravone"
        tag: "ex scalo ferroviario"
        context: "binari e piazzali aperti, scuri e senza ombra"
      - id: caab
        name: "CAAB"
        tag: "mercato e logistica"
        context: "capannoni del mercato e piazzali"
      - id: fiera
        name: "Quartiere fieristico"
        tag: "padiglioni e piazzali"
        context: "padiglioni e grandi parcheggi"
      - id: villaggio-ina
        name: "Ducati Villaggio INA"
        tag: "centro commerciale e piazzali"
        context: "parcheggi e grandi coperture che trattengono calore"
      - id: aeroporto
        name: "Aeroporto"
        tag: "piste e piazzali"
        context: "superfici aperte e scure, esposte al sole per ore"
      - id: bolognina
        name: "Bolognina"
        tag: "a nord dei binari"
        context: "edifici ravvicinati e strade strette"
      - id: roveri
        name: "Roveri"
        tag: "zona industriale"
        context: "capannoni e piazzali della logistica, quasi senza ombra"
  legend:
    id: hotspot-legend
    title: "Aree di ricorrenza climatica"
    active:
      id: hotspot-legend-active
      one: "Rientrano nel 10% in almeno {n} anno su 14"
      other: "Rientrano nel 10% in almeno {n} anni su 14"
    scale:
      id: hotspot-legend-scale
      min: "1 estate"
      max: "14 estati"
    caption: "In quante delle 14 estati (dal 2013 al 2026) l’area è rientrata nel 10% di superfici più calde di Bologna."
    sourceLink:
      id: hotspot-source-link
      label: "Esplora i dati tecnici in dettaglio"
  sequence:
    id: hotspot-sequence
    playing: "14 estati, una sopra l’altra"
    done: "Tocca una frase per rivederla, o scorri per continuare"
  slider:
    id: hotspot-slider
    label: "Cambia la soglia di ricorrenza"
    valueTemplate: "≥ {n}/14"
    markLabelTemplate: "Imposta {n} estati su 14"
  handoff:
    id: hotspot-handoff
    question: "Perché proprio lì?"
    hint: "Tocca un hotspot per scoprire più dettagli"
