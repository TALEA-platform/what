cityPlan:
  id: climate-relief-city-plan
  bridge:
    id: climate-relief-city-plan-bridge
    lead: "Dove non sono presenti, si possono costruire."
  scene:
    id: climate-relief-city-plan-scene
    ariaLabel: "Dove manca, si costruisce: scenario illustrativo di un quartiere tipo in cui spazi verdi, percorsi ombreggiati e portici diventano una rete"
    figureAriaLabel: "Scenario illustrativo, non una mappa dei cantieri. La pianta combina elementi riconoscibili di Bologna in un quartiere tipo: un viale, isolati a corte, strade porticate, palazzine, una piazza lastricata in parte usata per la sosta e il cortile asfaltato di una scuola. La piazza mantiene molto lastricato ma apre aiuole permeabili, acqua e ombra; altri spazi asfaltati diventano aree verdi. Una nuova fermata, filari di alberi e portici entrano nella stessa rete e un itinerario ombreggiato attraversa la mappa dal parco al giardino."
    svgDescription: "Un pezzo di Bologna visto dall'alto: il viale di circonvallazione con l'aiuola alberata, il centro con piazze, palazzi a corte, fronti aperti e due strade porticate. Fuori, una periferia diversa per densita', con condomini, case a schiera, villini, laboratori, una piazza lastricata usata come parcheggio e il cortile d'asfalto di una scuola. Scorrendo, la piazza mantiene il suo centro lastricato ma apre aiuole permeabili, acqua e ombra, mentre il cortile diventa piu' verde. Una fermata, gruppi di alberi, pergolati e portici li uniscono in una fascia d'ombra continua che attraversa la mappa dal parco al giardino."
    context:
      id: climate-relief-city-plan-context
      title: "Dove manca, si costruisce"
      note: "Scenario illustrativo di un quartiere tipo, non una mappa dei cantieri"
  beats:
    - id: quartiere
      lead: "I rifugi climatici non sono sempre vicini a tutti."
      body:
        - id: neighborhood-body
          text: "In alcune aree, parchi e giardini restano lontano dai percorsi quotidiani."
    - id: buco
      lead: "La distanza fa la differenza."
      body:
        - id: distance-body
          text: "È importante poterci arrivare con facilità."
    - id: costruisce
      lead: "Dove mancano, si possono costruire."
      body:
        - id: nature-before
          text: "Le "
        - id: nature-keyword
          text: "soluzioni basate sulla natura"
          kw: true
        - id: nature-after
          text: " si ispirano a processi naturali e possono aiutare gli spazi urbani ad affrontare meglio il caldo."
    - id: nonuno
      lead: "Un luogo solo non basta."
      body:
        - id: distributed-network-body
          text: "Più spazi distribuiti nei quartieri creano una presenza diffusa, vicino alla vita di ogni giorno."
    - id: corridoi
      lead: "Il percorso conta quanto la meta."
      body:
        - id: corridor-before
          text: "Collegare più punti della città lungo uno stesso itinerario dà forma a un "
        - id: corridor-keyword
          text: "corridoio climatico"
          kw: true
        - id: corridor-after
          text: "."
    - id: portici
      lead: "Un pezzo di rete esiste già."
      body:
        - id: porticoes-before
          text: "I "
        - id: porticoes-keyword
          text: "portici"
          kw: true
        - id: porticoes-middle
          text: " attraversano Bologna formando percorsi continui e riparati. Il progetto comunale "
        - id: shadow-lines-link
          text: "Linee d'ombra"
          linkId: shadow-lines-project
        - id: porticoes-after
          text: " studia come valorizzarli e connetterli ai rifugi climatici."
    - id: rete
      lead: "Quando i luoghi si collegano, cambia la città."
      body:
        - id: connected-network-body
          text: "Nuovi spazi, corridoi climatici e portici possono lavorare insieme e formare un sistema continuo e accessibile."
  annotations:
    - id: parking
      label: "parcheggio"
    - id: new-relief
      label: "nuovo rifugio climatico"
    - id: corridor
      label: "corridoio climatico"
    - id: arcades
      label: "portici"
  legend:
    id: climate-relief-city-plan-legend
    label: "Per collegare i luoghi di sollievo"
    items:
      - id: new-green-spaces
        label: "spazi verdi nuovi"
      - id: climate-corridors
        label: "corridoi climatici"
      - id: porticoes
        label: "portici"
  vignetteDescriptions:
    - id: costruire
      text: "Una piazza lastricata ampia fra due palazzine, sul fronte di una strada, con quattro auto raccolte lungo stalli segnati su un solo bordo, una canaletta, lampioni, paracarri e rastrelliere. Arrivano le transenne e nella pavimentazione si aprono due grandi aiuole: sotto la pietra c'e' la terra nuda, poi il prato. Ci si piantano quattro alberi, si monta un pergolato con il rampicante, si scava un giardino della pioggia con la ghiaia e le pietre, e a filo del lastricato si accende una fontana a raso. Gran parte della pietra resta, con tre panche e le persone che ci stanno; sul marciapiede compare anche una fermata del bus con pensilina."
    - id: corridoio
      text: "Una strada lungo un fronte di palazzine. Il marciapiede resta all'ombra per tutta la sua lunghezza con quattro mezzi diversi, uno dopo l'altro: un tratto di portico con le sue arcate, una pergola con i travetti che getta un'ombra a righe, un filare di tre alberi e infine una siepe con un alberello. All'inizio l'ombra e' a chiazze staccate; alla fine e' una fascia continua, e le persone la percorrono da un capo all'altro senza mai un tratto al sole."
    - id: portico
      text: "Un portico bolognese visto di sbieco: tre campate con i piedritti sul filo strada, gli archi a tutto centro con la loro ghiera di conci e il concio di chiave, e le volte che vanno indietro fino al muro del palazzo, dove si vedono le vetrine e i portoni del piano terra. Sopra, tre piani di finestre con le persiane e un tetto a due falde con il comignolo. Sotto il passaggio corre un'ombra continua, e ci stanno una signora anziana con il bastone e una persona in carrozzina: il portico e' gia' un rifugio, e lo e' per chi ne ha piu' bisogno."
