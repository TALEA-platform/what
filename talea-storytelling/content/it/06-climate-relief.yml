schemaVersion: 1
locale: it

chapter:
  id: climate-relief

opening:
  id: climate-relief-opening
  title: "Gli spazi verdi sono la soluzione."
  lead:
    id: climate-relief-lead
    before: "Un "
    term:
      id: climate-refuge-term
      text: "rifugio climatico"
      glossary: climate-refuge
    after: " nasce quando più forme di sollievo si incontrano nello stesso luogo."
  body:
    - id: climate-relief-opening-body
      text: "Questa combinazione trasforma uno spazio di passaggio in un luogo dove fermarsi, rinfrescarsi e riprendere fiato nelle ore più calde."
  close: "Vediamo come una strada può diventarlo, un elemento alla volta."

explainer:
  id: climate-refuge-explainer
  figure:
    id: climate-refuge-figure
    ariaLabel: "Una strada assolata di Bologna — sullo sfondo le Due Torri e i colli — si trasforma progressivamente in un rifugio climatico: compaiono ombra, strutture leggere, sedute, acqua, verde e suolo permeabile, una fermata dell’autobus a due passi. Il sole resta ma si fa più leggero, gli oggetti proiettano ombre e piccole etichette indicano la temperatura al sole e all’ombra. Le persone accaldate ritrovano il sorriso."
    svgAriaLabel: "Cos'e' un rifugio climatico"
  model:
    id: climate-refuge-model
    title: "Una piazza di quartiere prima della trasformazione climatica"
    description: "Una piazza minerale e assolata, circondata da due edifici bolognesi e attraversata da alcune persone. Il modello può essere ruotato a 360 gradi."
    temperature:
      id: climate-refuge-temperature
      legend: "TEMPERATURA DELL’ARIA"
      locations:
        - id: start
          text: "al sole"
        - id: natural-shade
          text: "sotto gli alberi"
        - id: continuous-shade
          text: "al riparo"
        - id: rest
          text: "al riparo"
        - id: water
          text: "vicino all’acqua"
        - id: living-ground
          text: "vicino all’acqua"
        - id: accessibility
          text: "nel rifugio"
        - id: complete
          text: "nel rifugio"
    controls:
      id: climate-refuge-model-controls
      panGroup: "Sposta la vista"
      panUp: "Sposta la vista in alto"
      panLeft: "Sposta la vista a sinistra"
      panRight: "Sposta la vista a destra"
      panDown: "Sposta la vista in basso"
      zoomOut: "Allontana la vista"
      zoomIn: "Avvicina la vista"
      hint: "Trascina per girare la piazza · doppio clic per avvicinarti"
  steps:
    - id: start
      added: "La trasformazione comincia"
      paragraphs:
        - "Una piazza spoglia e senza ripari."
    - id: natural-shade
      added: "Ombra naturale"
      piece: "ombra"
      paragraphs:
        - "Le chiome filtrano il sole e offrono il primo riparo."
    - id: continuous-shade
      added: "Ombra continua"
      piece: "riparo continuo"
      paragraphs:
        - "Pergole e tettoie proteggono anche dove gli alberi non arrivano."
    - id: rest
      added: "Sosta"
      piece: "sosta"
      paragraphs:
        - "Una seduta all’ombra trasforma il passaggio in una pausa."
    - id: water
      added: "Acqua"
      piece: "acqua"
      paragraphs:
        - "Avere acqua a disposizione per bere e rinfrescarsi aiuta ad abbassare la temperatura corporea."
    - id: living-ground
      added: "Suolo vivo"
      piece: "verde e suolo vivo"
      paragraphs:
        - "Il verde a terra mitiga il calore e permette all'acqua piovana di infiltrarsi naturalmente nel terreno."
    - id: accessibility
      added: "Accessibilità"
      piece: "accessibilità"
      paragraphs:
        - "Il rifugio funziona davvero se è inclusivo e facilmente raggiungibile da tutti."
    - id: complete
      added: "Il rifugio è completo"
      paragraphs:
        - "La stessa piazza, prima difficile da attraversare, ora accoglie chi ha bisogno di una pausa."
        - "La vera differenza non è data da un singolo elemento, ma dal modo in cui assieme creano un microclima più fresco e confortevole."
  recipeLabel: "Un rifugio climatico è fatto di"
  sequence:
    id: climate-refuge-sequence
    playing: "Osserva la piazza · il prossimo elemento sta arrivando"
    done: "Scorri per continuare"

