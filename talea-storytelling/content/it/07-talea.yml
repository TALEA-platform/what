schemaVersion: 1
locale: it

project:
  chapter:
    id: talea-project
  header:
    id: talea-project-header
    title: "Bologna ci sta già lavorando."
    subtitle: "E lo sta facendo con i cittadini."
    lockup: "Il progetto si chiama"
    logo:
      id: talea-project-logo
      alt: "TALEA"
      linkId: talea-platform
  meaning:
    id: talea-project-meaning
    lead:
      - id: talea-name
        text: "TALEA"
        glossary: talea-project
      - id: talea-purpose
        text: " trasforma gli spazi pubblici utilizzando soluzioni basate sulla natura, per renderli più vivibili e aiutare la città ad adattarsi a un clima che cambia."
    body: "Il nome deriva dal concetto di talea in botanica: un ramo tagliato dalla pianta madre che, nelle condizioni giuste, mette radici e continua a crescere."
  facts:
    id: talea-project-facts
    label: "Il progetto in breve"
    items:
      - id: chi
        label: "Chi lo realizza"
        value: "Il Comune di Bologna"
        noteTemplate: "con l’Università di Bologna e altri {n} partner"
      - id: quando
        label: "Quanto dura"
        value: "Fino al 2028"
        note: "42 mesi, da dicembre 2024 a maggio 2028"
      - id: fondi
        label: "Chi lo finanzia"
        value: "Unione Europea"
        note: "cofinanziato attraverso European Urban Initiative"
  bridge:
    id: talea-project-zones-bridge
    text: "Il lavoro comincia da qui."

zones:
  id: talea-zones
  ariaLabel: "Mappa delle aree pilota del progetto TALEA"
  legend:
    id: talea-zones-legend
    area: "Aree progettuali"
  intro:
    id: talea-zones-intro
    title: "TALEA prende forma sul territorio."
    body:
      - id: zones-intro-before-fossolo
        text: "Due aree di intervento iniziali, nate dall’incontro tra analisi del territorio e partecipazione dei cittadini: la zona del "
      - id: zones-intro-fossolo
        text: "Fossolo"
        emphasis: true
      - id: zones-intro-between
        text: ", e la fascia a "
      - id: zones-intro-historic-centre
        text: "nord del centro storico"
        emphasis: true
      - id: zones-intro-end
        text: "."
  areas:
    - zoneId: 0
      name: "Fossolo"
      body:
        - id: fossolo-before-place
          text: "Nel Quartiere Savena, il lavoro si concentra sul "
        - id: fossolo-place
          text: "Bosco Tanari"
          emphasis: true
        - id: fossolo-after-place
          text: " e sulle aree verdi vicine, per valorizzarle, e rafforzare i collegamenti tra parchi e giardini."
    - zoneId: 1
      name: "Centro storico-Nord"
      body:
        - id: historic-centre-before-boldrini
          text: "Fra "
        - id: historic-centre-boldrini
          text: "via Boldrini"
          emphasis: true
        - id: historic-centre-between-streets
          text: " e "
        - id: historic-centre-rosselli
          text: "via Fratelli Rosselli"
          emphasis: true
        - id: historic-centre-after-streets
          text: ", il progetto mette al centro vegetazione, suolo e spazio pubblico, in un’area densa, priva di terreno capace di assorbire la pioggia."
  loadError: "Mappa non caricata al momento."

participation:
  id: talea-participation
  intro:
    title: "Il contributo di chi vive questi quartieri aiuta a definire le priorità."
    body: "Attraverso passeggiate, mappature e laboratori, i cittadini segnalano criticità, esprimono bisogni e formulano proposte."
    support: "Questi contributi affiancano le analisi tecniche e ambientali e aiutano a definire priorità e possibili interventi."
    vignette:
      ariaLabel: "Su una mappa di quartiere, tre mani indicano un percorso, collocano un marker e annotano una proposta."
      description: "La mappa raccoglie marker georeferenziati e simboli di alberi, sedute, acqua e percorsi; le mani rappresentano osservazione, segnalazione e proposta."
  stat:
    mappedLabel: "proposte mappate"
    scope: "nelle due aree di progetto"
    methodology: "Dati raccolti e localizzati sulla mappa durante le attività partecipative."
  chart:
    title: "Quali temi emergono?"
    subtitle: "Le proposte raccolte mostrano esigenze differenti nei due contesti."
    proposalsLabel: "proposte"
    categories:
      - id: greenComfort
        label: "Verde e comfort ambientale"
      - id: servicesAmenities
        label: "Servizi e arredi"
      - id: accessibilityRoutes
        label: "Accessibilità e percorsi"
    areas:
      - id: historicCentreNorth
        name: "Centro storico-Nord"
      - id: fossolo
        name: "Fossolo"
    interpretation: "Nel Centro storico-Nord prevalgono le proposte legate a verde e comfort ambientale. A Fossolo emergono soprattutto servizi e arredi, insieme a un peso maggiore dell’accessibilità."
  takeaway:
    text: "I contributi raccolti vengono considerati insieme alle analisi tecniche e ambientali nelle scelte progettuali."

