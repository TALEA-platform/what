closing:
  id: talea-closing
  final:
    id: talea-closing-final
    standout: "Un albero, una fontana, una piazza che respira: la città più fresca si costruisce così, una talea alla volta."
  sources:
    id: talea-public-tools
    title: "Tutto quello che hai visto viene da qui"
