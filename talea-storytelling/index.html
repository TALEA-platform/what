<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/talea-logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <script>
      (function () {
        var config = {
          // ── La reference editoriale: 1920 × 1065 ──────────────────────────
          // La storia è impaginata per questa viewport, e a questa viewport la
          // scala vale esattamente 1. A ogni altra risoluzione NON si
          // ri-impagina: si disegna comunque a `referenceWidth` px dentro una
          // cornice, e la cornice si rimpicciolisce o si ingrandisce finché non
          // combacia con lo schermo. Qualunque viewport vede quindi lo stesso
          // disegno, in scala — sotto E sopra la reference.
          referenceWidth: 1920,
          // L'altezza della reference non entra nel calcolo della scala (la
          // decide la larghezza, vedi `fitFrame`): sta qui perché è la metà
          // dichiarata della coppia, e perché è il numero da cambiare se un
          // giorno la reference cambia formato.
          referenceHeight: 1065,
          // Sotto questa soglia la cornice smette di simulare i 1920 px e
          // consegna all'app la larghezza fisica del browser.
          mobileBreakpoint: 1280,
          // Il cancello degli schermi piccoli. Ora ogni risoluzione passa dalla
          // cornice qui sopra, quindi resta spento: rimettere `true` per
          // richiuderlo (le due soglie qui sotto tornano a valere).
          gateEnabled: false,
          blockMaxWidth: 1023,
          blockMaxHeight: 799,
        };
        window.__taleaViewportConfig = config;
        var userAgent = navigator.userAgent || "";
        var isIPhone =
          /iPhone|iPod/i.test(userAgent) && /AppleWebKit/i.test(userAgent);
        var isTopLevel = window.self === window.top;

        // iPhone uses the physical document viewport. This is deliberately a
        // conservative, ES5-style bootstrap because it runs before Vite's
        // legacy feature probe has selected a bundle. iPad and Mac Safari do
        // not match this branch and retain the existing frame shell.
        window.__taleaIPhoneDirectMount = Boolean(isTopLevel && isIPhone);
        if (window.__taleaIPhoneDirectMount) {
          document.documentElement.setAttribute("data-talea-iphone-direct", "true");

          // Cause uses an exact raster aspect ratio. Calculate these four
          // dimensions once from the stable, toolbar-visible viewport so the
          // sticky grid never depends on dvh changing during a swipe. Re-run
          // only for a genuine width/orientation change.
          var causeGeometryWidth = window.innerWidth || 0;
          var applyIPhoneCauseGeometry = function () {
            var width = window.innerWidth || 390;
            var height =
              window.innerHeight || document.documentElement.clientHeight || 1;
            // A fixed 325px reserve left only ~294px for the raster on a
            // short 375x667 viewport. Keep the existing reserve on regular
            // iPhones, but let compact-height phones use the available width;
            // the sticky stage already has a 620px minimum and can contain the
            // copy without shrinking the map to thumbnail size.
            var compactCauseViewport = width <= 430 && height <= 720;
            if (compactCauseViewport) {
              document.documentElement.setAttribute(
                "data-talea-compact-cause",
                "true"
              );
            } else {
              document.documentElement.removeAttribute(
                "data-talea-compact-cause"
              );
            }
            var copyReserve = width <= 520 ? 325 : 270;
            var causeWidth = compactCauseViewport
              ? Math.max(1, Math.min(width - 24, 860))
              : Math.max(
                  1,
                  Math.min(
                    width - 24,
                    860,
                    (height - 68 - copyReserve) * 1.075
                  )
                );
            var compareWidth = compactCauseViewport
              ? Math.max(1, Math.min(width - 24, 860))
              : Math.max(
                  1,
                  Math.min(width - 24, 860, (height - 305) * 1.075)
                );
            document.documentElement.style.setProperty(
              "--talea-causes-visual-width",
              causeWidth + "px"
            );
            document.documentElement.style.setProperty(
              "--talea-causes-visual-height",
              causeWidth / 1.075 + "px"
            );
            document.documentElement.style.setProperty(
              "--talea-causes-compare-width",
              compareWidth + "px"
            );
            document.documentElement.style.setProperty(
              "--talea-causes-compare-height",
              compareWidth / 1.075 + "px"
            );
          };
          var updateIPhoneCauseGeometry = function () {
            var nextWidth = window.innerWidth || causeGeometryWidth;
            if (Math.abs(nextWidth - causeGeometryWidth) < 3) return;
            causeGeometryWidth = nextWidth;
            applyIPhoneCauseGeometry();
          };
          applyIPhoneCauseGeometry();
          window.addEventListener("resize", updateIPhoneCauseGeometry, false);
          window.addEventListener(
            "orientationchange",
            applyIPhoneCauseGeometry,
            false
          );

          // Keep the production svh/dvh layout untouched on current Safari.
          // Only Safari versions that cannot parse those units receive the
          // measured-pixel fallback; mixing both strategies changed sticky
          // geometry and could leave the Cause stage showing only its paper
          // background.
          var supportsModernViewport =
            window.CSS &&
            window.CSS.supports &&
            window.CSS.supports("height", "100svh") &&
            window.CSS.supports("height", "100dvh");
          if (!supportsModernViewport) {
            document.documentElement.setAttribute(
              "data-talea-legacy-viewport",
              "true"
            );

            var viewportFrame = 0;
            var viewportTimer = 0;
            var viewportWidth = window.innerWidth || 0;
            var applyIPhoneViewport = function () {
              viewportFrame = 0;
              var height =
                window.innerHeight || document.documentElement.clientHeight || 1;
              var unit = height / 100;
              document.documentElement.style.setProperty("--talea-vh", unit + "px");
              document.documentElement.style.setProperty(
                "--talea-viewport-height",
                height + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-viewport-fifth",
                height / 5 + "px"
              );
              // Keep the Bridge -> Aria overlap deterministic on Safari
              // versions without svh. The background overlaps by the same
              // amount as mobile production; only the chapter content is
              // delayed until the Hero has started fading.
              document.documentElement.style.setProperty(
                "--talea-trend-overlap",
                height * 0.85 + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-trend-content-delay",
                height * 0.4 + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-causes-panel-height",
                Math.max(570, Math.min(height * 0.78, 820)) + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-causes-last-panel-height",
                Math.max(690, Math.min(height * 0.96, 960)) + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-causes-panels-pad-top",
                Math.max(140, Math.min(height * 0.2, 220)) + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-causes-panels-pad-bottom",
                height * 0.14 + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-shadow-beat-height",
                Math.max(520, Math.min(height * 0.7, 740)) + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-shadow-closing-height",
                Math.max(460, Math.min(height * 0.6, 640)) + "px"
              );
              document.documentElement.style.setProperty(
                "--talea-shadow-tail-height",
                Math.max(44, Math.min(height * 0.065, 76)) + "px"
              );
            };
            var scheduleIPhoneViewport = function (event) {
              var nextWidth = window.innerWidth || viewportWidth;
              // Safari changes innerHeight as its toolbar expands/collapses. A
              // height-only resize must not resize sticky scenes mid-scroll.
              if (
                event &&
                event.type === "resize" &&
                Math.abs(nextWidth - viewportWidth) < 3
              ) {
                return;
              }
              viewportWidth = nextWidth;
              if (!viewportFrame) {
                viewportFrame = window.requestAnimationFrame(applyIPhoneViewport);
              }
              window.clearTimeout(viewportTimer);
              viewportTimer = window.setTimeout(applyIPhoneViewport, 160);
            };
            applyIPhoneViewport();
            window.addEventListener("resize", scheduleIPhoneViewport, false);
            window.addEventListener(
              "orientationchange",
              scheduleIPhoneViewport,
              false
            );
          }
        }
        // Nessuna soglia: la cornice vale a ogni risoluzione. Sulla reference il
        // fattore è 1 e il risultato è indistinguibile dal disegno diretto;
        // sopra e sotto è la stessa composizione, ingrandita o ridotta.
        if (isTopLevel && !window.__taleaIPhoneDirectMount) {
          window.__taleaViewportFrameShell = true;
          document.documentElement.dataset.taleaViewportFrameShell = String(config.referenceWidth);
        }
      })();
    </script>
    <title>Talea - Storytelling</title>

    <!-- I titoli di capitolo sono in Newsreader e il corpo in Inter. Il foglio
         di stile dei font sta QUI e non più in un @import dentro theme.css:
         dentro il CSS la richiesta a Google partiva solo dopo che il bundle CSS
         era arrivato, cioè in coda a tutto. Da qui parte con il documento. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
    />

    <!-- Il poster è il primo fotogramma garantito della storia: se il video non
         fa in tempo, è quello che il lettore vede. Vale la precedenza. -->
    <link rel="preload" as="image" href="/data/hero/bologna-poster.jpg" />

    <!-- ── Schermata d'ingresso ────────────────────────────────────────────────
         Sta qui, inline, e non in un componente React di proposito: un loader
         montato da React può apparire solo DOPO che il bundle è stato scaricato
         e interpretato, cioè coprirebbe la seconda metà dell'attesa lasciando
         scoperta la prima — che è esattamente quella bianca e vuota. Inline
         dipinge al primo frame utile, prima di qualsiasi CSS e di qualsiasi JS. -->
    <style>
      .talea-boot {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2rem;
        /* --paper del tema, ripetuto a mano: theme.css qui non è ancora arrivato. */
        background: #f6f4ee;
        opacity: 1;
        transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .talea-boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .tb-locked,
      .tb-locked body {
        overflow: hidden;
      }

      .talea-resize-shell {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        background: #f6f4ee;
      }
      /* Larghezza, altezza e scala vere le mette `fitFrame()` in JS: questi
         sono solo i valori del primo fotogramma, prima che giri. Niente
         `transition` e niente `will-change` qui dentro: la prima animerebbe la
         scala a ogni ridimensionamento (mezzo secondo di testo sfocato per
         nulla), la seconda inchioderebbe la rasterizzazione a una scala sola,
         che è esattamente il modo di ottenere testo morbido sopra la
         reference. */
      .talea-resize-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 100vh;
        border: 0;
        transform-origin: top left;
        background: #f6f4ee;
      }

      .tb-logo {
        width: min(46vw, 230px);
        height: auto;
        overflow: visible;
      }

      .tb-blue,
      .tb-yellow,
      .tb-branch,
      .tb-vein {
        fill: none;
        /* pathLength="1" su ogni tratto: la lunghezza reale non conta più, il
           disegno si anima con un solo valore per tutti. */
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .tb-blue {
        stroke: #3673c0;
        stroke-width: 15.524;
        stroke-linecap: round;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .tb-yellow {
        stroke: #f7e91a;
        stroke-width: 15.524;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .tb-branch {
        stroke: #38b850;
        stroke-width: 15.524;
        stroke-linecap: round;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .tb-vein {
        stroke: #38b850;
        stroke-width: 7.772;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tb-word {
        fill: #17361c;
      }
      /* L'animazione sta sul GRUPPO, non sul path: una `transform` messa via CSS
         sostituisce in blocco l'attributo `transform` dell'elemento, e la
         scritta perderebbe il proprio translate finendo fuori dai cerchi.
         Sul gruppo invece si compone, perché il gruppo non ne ha uno suo. */
      .tb-word-g {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }
      .tb-yellow-fill {
        fill: #f7e91a;
        opacity: 0;
      }

      @keyframes tb-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes tb-appear {
        from {
          opacity: 0;
          /* Solo scala: una traslazione qui erediterebbe il flip verticale
             della matrice di root e salirebbe dalla parte sbagliata. */
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes tb-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes tb-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.028);
          opacity: 0.88;
        }
      }

      /* ── La talea germoglia ──
         Prima il ramo, poi le venature che spuntano, poi i due cerchi che si
         chiudono attorno e la scritta che emerge. È il nome del progetto: una
         talea è un ramo tagliato che mette radici. */
      .tb-branch {
        animation: tb-draw 460ms 40ms cubic-bezier(0.33, 0, 0.2, 1) forwards;
      }
      .tb-vein {
        animation: tb-draw 240ms cubic-bezier(0.33, 0, 0.2, 1) forwards;
      }
      .tb-p3 { animation-delay: 380ms; }
      .tb-p4 { animation-delay: 418ms; }
      .tb-p5 { animation-delay: 456ms; }
      .tb-p6 { animation-delay: 494ms; }
      .tb-p7 { animation-delay: 532ms; }
      .tb-p12 { animation-delay: 570ms; }
      .tb-p13 { animation-delay: 608ms; }
      .tb-word-g {
        animation: tb-appear 380ms 560ms cubic-bezier(0.2, 0, 0.2, 1) forwards;
      }
      .tb-blue {
        animation: tb-draw 700ms 620ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .tb-yellow {
        animation: tb-draw 700ms 700ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .tb-yellow-fill {
        animation: tb-fade 260ms 1180ms linear forwards;
      }
      /* Finito il disegno il logo non si ferma di colpo: respira, così un'attesa
         lunga non sembra mai un blocco. */
      .tb-logo {
        animation: tb-breathe 3.2s 1500ms ease-in-out infinite;
      }

      /* ── Barra di avanzamento ──
         Compare SOLO se l'attesa supera la soglia oltre la quale il lettore
         inizia a chiedersi se si è rotto qualcosa. Sotto quella soglia il
         respiro del logo basta, e una barra sarebbe rumore. */
      .tb-bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: rgba(27, 58, 41, 0.12);
        overflow: hidden;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .talea-boot.is-slow .tb-bar {
        opacity: 1;
      }
      .tb-bar-fill {
        display: block;
        width: 100%;
        height: 100%;
        background: #38b850;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .tb-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ── Cancello schermi piccoli (SPENTO: `gateEnabled: false`) ─────────
         Resta qui, foglio di stile e markup, perché è una porta che si può
         voler richiudere: oggi ogni risoluzione entra dalla cornice a 1920.
         Il perché originale, se serve rimetterlo:
         La storia è scroll-driven: mappe che si montano l'una sull'altra,
         grafici che si scoprono per gradi, un video a tutta pagina. Dentro un
         viewport piccolo non è "stretta", è rotta — e una pagina rotta
         costa più di una porta chiusa con scritto sopra il perché.
         Sta qui, inline, per la stessa ragione della schermata d'ingresso: si
         dipinge al primo fotogramma utile, prima di qualunque bundle. Da
         togliere quando la versione per schermi piccoli sarà pronta. */
      .talea-gate {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2.5rem 1.75rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
        /* --paper e --ink del tema, ripetuti a mano: qui theme.css non arriva
           mai, perché su schermi piccoli l'app non si monta affatto. */
        background: #f6f4ee;
        color: #1b3a29;
        text-align: center;
        /* Telefono basso e girato di lato: il testo scorre invece di uscire. */
        overflow-y: auto;
      }
      .talea-gate[hidden] {
        display: none;
      }
      /* Il marchio non è duplicato: è lo stesso nodo della schermata
         d'ingresso, spostato qui dallo script. Una sola copia del disegno, e
         l'animazione di germoglio se la porta dietro. */
      .talea-gate .tb-logo {
        width: min(58vw, 186px);
      }

      .tg-text {
        max-width: 31ch;
      }
      .tg-title {
        margin: 0;
        font-family: "Newsreader", Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.45rem, 6.2vw, 1.9rem);
        line-height: 1.22;
        letter-spacing: -0.01em;
        color: #0b2a18;
      }
      .tg-body {
        margin: 0.85rem 0 0;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.55;
        color: #55705f;
      }

      /* Telefono girato di lato: quattrocento pixel d'altezza non reggono il
         respiro verticale del ritratto. Qui si stringe invece di scorrere. */
      @media (max-height: 520px) {
        .talea-gate {
          gap: 1.1rem;
          padding: 1.5rem 1.75rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
        }
        .talea-gate .tb-logo {
          width: min(24vw, 104px);
        }
        .tg-text {
          max-width: 46ch;
        }
        .tg-title {
          font-size: clamp(1.15rem, 3.1vw, 1.5rem);
        }
        .tg-body {
          margin-top: 0.5rem;
          font-size: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tb-logo,
        .tb-logo path,
        .tb-word-g {
          animation: none !important;
        }
        .tb-blue,
        .tb-yellow,
        .tb-branch,
        .tb-vein {
          stroke-dashoffset: 0;
        }
        /* Niente `transform: none` sui path, per la stessa ragione di sopra. */
        .tb-word-g,
        .tb-yellow-fill {
          opacity: 1;
        }
        .talea-boot {
          animation: tb-fade 300ms linear;
        }
      }

      @supports not (gap: 1rem) {
        .talea-boot .tb-bar {
          margin-top: 2.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="talea-boot" class="talea-boot" role="status" aria-live="polite">
      <svg class="tb-logo" viewBox="0 0 680.3147 604.724" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Talea">
      <g transform="matrix(1.3333333,0,0,-1.3333333,0,604.724)">
        <path class="tb-blue tb-p0" pathLength="1" transform="translate(249.5695,438.511)" d="m 0,0 c -89,19.351 -192.986,-9.738 -228.765,-113.385 -50.63,-209.04 108.469,-245.217 145.851,-256.79"/>
        <path class="tb-yellow tb-p1" pathLength="1" transform="translate(363.015,355.3655)" d="m 0,0 c 162.417,-24.5 134.432,-201.531 134.432,-201.531 0,0 -11.219,-69.697 -69.396,-109.456 -68.837,-47.25 -177.848,-49.251 -256.856,18.957"/>
        <path class="tb-blue tb-p2" pathLength="1" transform="translate(363.5553,353.9207)" d="m 0,0 c 0,0 -33.669,66.267 -113.986,84.59 -89,19.352 -192.986,-9.737 -228.764,-113.384"/>
        <path class="tb-vein tb-p3" pathLength="1" transform="translate(168.8589,74.45)" d="M 0,0 C 0,0 4.626,18.037 40.14,67.893"/>
        <path class="tb-vein tb-p4" pathLength="1" transform="translate(308.3044,293.4781)" d="M 0,0 34.359,8.061"/>
        <path class="tb-vein tb-p5" pathLength="1" transform="translate(180.2941,98.3387)" d="M 0,0 -27.277,55.296"/>

      <div class="tb-bar" aria-hidden="true"><span class="tb-bar-fill"></span></div>

    <!-- Il marchio qui dentro non c'è: se il cancello si apre, ci arriva
         quello della schermata d'ingresso, spostato dallo script qui sotto. -->
    <div id="talea-gate" class="talea-gate" role="dialog" aria-labelledby="tg-title" hidden>
      <div class="tg-text">
        <h1 class="tg-title" id="tg-title">TALEA, per ora, si guarda da uno schermo grande.</h1>
        <p class="tg-body">
          Stiamo costruendo la versione per schermi piccoli. Nel frattempo la
          storia è pronta e ti aspetta su computer o schermi più grandi.
        </p>
      </div>
    </div>

    <script>
      // ── Il cancello degli schermi piccoli ────────────────────────────────
      // Gira PRIMA dello script della schermata d'ingresso, di proposito: se
      // il cancello si chiude, il boot non deve nemmeno partire — aspetterebbe
      // il montaggio di un'app che non si monterà.
      (function () {
        var gate = document.getElementById("talea-gate");
        if (!gate) return;
        if (window.__taleaViewportFrameShell) return;
        var config = window.__taleaViewportConfig || {
          gateEnabled: false,
          blockMaxWidth: 1023,
          blockMaxHeight: 799,
        };
        // Sbloccato: gli schermi piccoli non trovano più una porta chiusa, ma la
        // storia in scala dentro la cornice a 1920 (vedi `referenceWidth` sopra).
        if (config.gateEnabled === false) return;
        var width = window.innerWidth || document.documentElement.clientWidth;
        var height = window.innerHeight || document.documentElement.clientHeight;
        var coarsePointer = window.matchMedia("(pointer: coarse)").matches;

        // Telefoni e tablet piccoli restano fuori. Serve il dito (pointer:
        // coarse) E una larghezza sotto soglia; l'altezza resta una rete per i
        // dispositivi bassi/girati, ma più stretta perché il problema vero è la
        // colonna troppo corta in orizzontale. La soglia include anche iPad
        // mini e iPad Air, che hanno ancora poco spazio per questa storia.
        var smallTouchScreen =
          coarsePointer && (width <= config.blockMaxWidth || height <= config.blockMaxHeight);
        if (!smallTouchScreen) return;

        // Bandiera letta da main.jsx: l'app non si monta proprio. Montarla
        // dietro a un pannello opaco vorrebbe dire scaricare il video
        // dell'hero, accendere le mappe e mettere in ascolto gli osservatori
        // di scroll per una pagina che nessuno vedrà — sulla rete di un
        // dispositivo piccolo, per giunta.
        window.__taleaMobileGate = true;

        gate.hidden = false;
        document.documentElement.classList.add("tb-locked");

        var boot = document.getElementById("talea-boot");
        if (boot) {
          var mark = boot.querySelector(".tb-logo");
          if (mark) gate.insertBefore(mark, gate.firstChild);
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }

      })();
    </script>

    <div id="root"></div>

    <script>
      // ── Il cancello d'ingresso ──────────────────────────────────────────────
      // Regola d'ingaggio: si aspettano i font, il montaggio dell'app e il primo
      // fotogramma dell'hero (video pronto, oppure poster, oppure errore). NON si
      // aspetta il download completo del video: nessuno resta fermo davanti a uno
      // spinner per venti secondi, e comunque il poster copre il caso peggiore.
      //
      // Sopra a tutto c'è un tetto duro: scaduto quello si entra comunque, anche
      // se il bundle è esploso. Un loader senza via d'uscita è peggio del vuoto
      // che dovrebbe coprire.
      (function () {
        var el = document.getElementById("talea-boot");
        if (!el) return;

        var MIN_MS = 900; // sotto questa soglia il loader lampeggerebbe e basta
        var MAX_MS = 3000; // tetto duro
        var SLOW_MS = 1600; // oltre questa compare la barra
        var FADE_MS = 520; // deve combaciare con la transition del CSS

        var t0 = Date.now();
        // «poster» e «hero» sono due cose diverse e vanno tenute separate: il
        // poster è l'immagine di riserva scaricata davvero, l'hero è il video
        // che ce l'ha fatta (o che ha rinunciato). Se il video è lento si esce
        // dal tetto duro, ma con la certezza che sotto c'è già un'immagine.
        var gates = { fonts: false, app: false, poster: false, hero: false };
        var names = ["fonts", "app", "poster", "hero"];
        var leaving = false;
        var fill = el.querySelector(".tb-bar-fill");

        document.documentElement.classList.add("tb-locked");

        function paint() {
          var n = 0;
          for (var i = 0; i < names.length; i++) if (gates[names[i]]) n++;
          if (fill) fill.style.transform = "scaleX(" + n / names.length + ")";
          return n;
        }

        function leave() {
          if (leaving) return;
          leaving = true;
          if (fill) fill.style.transform = "scaleX(1)";
          window.setTimeout(function () {
            el.classList.add("is-leaving");
            document.documentElement.classList.remove("tb-locked");
            window.setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, FADE_MS);
          }, Math.max(0, MIN_MS - (Date.now() - t0)));
        }

        function ready(name) {
          if (leaving || !(name in gates) || gates[name]) return;
          gates[name] = true;
          if (paint() === names.length) leave();
        }

        function mountResizeFrame() {
          var config = window.__taleaViewportConfig || {};
          var virtualWidth = config.referenceWidth || 1920;
          var shell = document.createElement("div");
          var frame = document.createElement("iframe");
          var url = new URL(window.location.href);

          url.searchParams.set("talea-frame", String(virtualWidth));
          shell.className = "talea-resize-shell";
          frame.className = "talea-resize-frame";
          frame.title = "TALEA storytelling";
          frame.src = url.href;

          // In desktop la cornice resta larga `virtualWidth`: quello che cambia
          // è di quanto la si rimpicciolisce — o la si ingrandisce. In mobile
          // prende invece la larghezza fisica e scala 1, così React e le media
          // query possono comporre un layout dedicato.
          //
          // La scala la decide SOLO la larghezza, e non `min(w/1920, h/1065)`:
          // sui formati elencati le due danno lo stesso numero (16:9 e 16:10
          // sono più alti della reference, quindi il lato corto è sempre la
          // larghezza), ma su un viewport largo e basso il minimo lascerebbe due
          // bande vuote ai lati. L'altezza qui si compensa invece di tagliare:
          // l'altezza virtuale si ricava dalla stessa scala, così un `100vh` là
          // dentro vale esattamente uno schermo qui fuori, qualunque sia il
          // formato del viewport reale.
          var lastScale = 0;
          var lastHeight = 0;
          var lastWidth = 0;
          var resizeFrame = 0;
          var settledSync = 0;

          function applyFrameSize() {
            var physicalWidth = window.innerWidth;
            var isMobile = physicalWidth < (config.mobileBreakpoint || 1280);
            var frameWidth = isMobile ? physicalWidth : virtualWidth;
            var scale = isMobile ? 1 : physicalWidth / virtualWidth;
            var virtualHeight = Math.ceil(window.innerHeight / scale);
            // `resize` arriva a raffica e `orientationchange` gli si sovrappone:
            // senza questo confronto si riscriverebbero gli stessi tre valori a
            // ogni evento, cioè un re-layout della cornice — e una nuova
            // rasterizzazione del testo — per nulla.
            if (frameWidth !== lastWidth) {
              lastWidth = frameWidth;
              frame.style.width = frameWidth + "px";
            }
            if (virtualHeight !== lastHeight) {
              lastHeight = virtualHeight;
              frame.style.height = virtualHeight + "px";
            }
            if (scale !== lastScale) {
              lastScale = scale;
              frame.style.transform = "scale(" + scale + ")";
            }
          }

          function fitFrame() {
            if (resizeFrame) return;
            resizeFrame = window.requestAnimationFrame(function () {
              resizeFrame = 0;
              applyFrameSize();
            });
          }

          function scheduleSettledSync() {
            window.clearTimeout(settledSync);
            settledSync = window.setTimeout(fitFrame, 120);
          }

          function handleResize() {
            fitFrame();
            scheduleSettledSync();
          }

          frame.addEventListener("load", function () {
            fitFrame();
            leave();
          });
          window.addEventListener("resize", handleResize, { passive: true });
          // Su telefono la rotazione non sempre emette `resize` in tempo utile:
          // l'altezza va ricalcolata anche qui, o la cornice resta col formato
          // di prima e sotto avanza una fascia vuota.
          window.addEventListener("orientationchange", function () {
            fitFrame();
            scheduleSettledSync();
          }, { passive: true });
          shell.appendChild(frame);
          document.body.appendChild(shell);
          applyFrameSize();
        }

        window.__taleaBoot = { ready: ready, skip: leave };

        if (window.__taleaViewportFrameShell) {
          mountResizeFrame();
          // Il tetto duro vale anche qui: se la cornice non emette mai `load`
          // si entra lo stesso, e sotto c'è la sua schermata d'ingresso — che
          // è identica a questa, quindi il passaggio non si vede.
          window.setTimeout(leave, MAX_MS);
          return;
        }

        window.setTimeout(leave, MAX_MS);
        window.setTimeout(function () {
          if (!leaving) el.classList.add("is-slow");
        }, SLOW_MS);

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            ready("fonts");
          });
        } else {
          ready("fonts");
        }

        // Il poster è un background-image in CSS, che non emette eventi: lo si
        // scarica qui in parallelo per sapere quando è davvero pronto. La
        // richiesta è la stessa del <link rel="preload">, quindi non ne costa
        // una seconda — arriva dalla cache.
        var poster = new Image();
        poster.onload = poster.onerror = function () {
          ready("poster");
        };
        poster.src = new URL(
          "data/hero/bologna-poster.jpg",
          document.baseURI
        ).href;
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
